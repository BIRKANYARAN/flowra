<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  body { padding: 18px 24px; }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .swatch { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .swatch .chip { height: 38px; }
  .swatch .label { font-size: 10px; font-weight: 600; color: var(--fg-3); text-align: center; padding: 4px 0; font-variant-numeric: tabular-nums; background: #fff; }
  .swatch.active { box-shadow: 0 0 0 2px var(--primary-600), 0 0 0 4px var(--primary-100); }
  .legend { display: flex; gap: 14px; align-items: center; margin-top: 12px; font-size: 11px; color: var(--fg-3); }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  h3 { margin: 0 0 12px 0; font-weight: 900; font-size: 13px; letter-spacing: -.01em; color: var(--fg-1); }
</style></head><body>
<div class="card">
  <h3>Primary · Violet</h3>
  <div class="ramp">
    <div class="swatch"><div class="chip" style="background:#f5f3ff"></div><div class="label">50</div></div>
    <div class="swatch"><div class="chip" style="background:#ede9fe"></div><div class="label">100</div></div>
    <div class="swatch"><div class="chip" style="background:#ddd6fe"></div><div class="label">200</div></div>
    <div class="swatch"><div class="chip" style="background:#c4b5fd"></div><div class="label">300</div></div>
    <div class="swatch"><div class="chip" style="background:#a78bfa"></div><div class="label">400</div></div>
    <div class="swatch"><div class="chip" style="background:#8b5cf6"></div><div class="label">500</div></div>
    <div class="swatch active"><div class="chip" style="background:#7c3aed"></div><div class="label">600</div></div>
    <div class="swatch"><div class="chip" style="background:#6d28d9"></div><div class="label">700</div></div>
    <div class="swatch"><div class="chip" style="background:#5b21b6"></div><div class="label">800</div></div>
    <div class="swatch"><div class="chip" style="background:#4c1d95"></div><div class="label">900</div></div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#7c3aed"></span><b style="color:var(--fg-1)">600</b> &nbsp;Primary CTA · active nav · logo</span>
    <span><span class="dot" style="background:#ede9fe"></span><b style="color:var(--fg-1)">100</b> &nbsp;Tinted backgrounds</span>
  </div>
</div>
</body></html>
