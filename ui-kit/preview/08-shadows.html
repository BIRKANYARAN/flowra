<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  body { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .demo { display: flex; flex-direction: column; gap: 8px; }
  .name { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-4); }
  .surface {
    background: #fff; border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--fg-3);
  }
  .surface.card { box-shadow: 0 1px 2px 0 rgba(17,24,39,.05), 0 1px 3px 0 rgba(17,24,39,.06); }
  .surface.pdf { box-shadow: 0 0 0 1px rgba(17,24,39,.04), 0 8px 24px -8px rgba(17,24,39,.12); }
  .meta { font-size: 9px; color: var(--fg-3); font-family: ui-monospace, monospace; }
</style></head><body>
<div class="card">
  <div class="row">
    <div class="demo">
      <span class="name">shadow-card</span>
      <div class="surface card">Subtle — used on KPI tiles only when needed</div>
      <span class="meta">0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06)</span>
    </div>
    <div class="demo">
      <span class="name">shadow-pdf</span>
      <div class="surface pdf">Heavier — proforma preview / printed</div>
      <span class="meta">0 0 0 1px rgba(17,24,39,.04), 0 8px 24px -8px rgba(17,24,39,.12)</span>
    </div>
  </div>
</div>
</body></html>
