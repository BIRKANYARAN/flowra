<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  body { padding: 18px 24px; }
  .row { display: flex; gap: 8px; align-items: end; }
  .tok { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .bar { background: var(--primary-200); height: 24px; border-radius: 4px; }
  .name { font-size: 10px; color: var(--fg-1); font-weight: 600; }
  .px { font-size: 9px; color: var(--fg-4); font-family: ui-monospace, monospace; }
  .legend { display: flex; gap: 18px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-subtle); font-size: 11px; color: var(--fg-3); }
  .legend b { color: var(--fg-1); font-weight: 700; }
  h3 { margin: 0 0 10px 0; font-weight: 900; font-size: 13px; letter-spacing: -.01em; }
</style></head><body>
<div class="card">
  <h3>Spacing scale (Tailwind 4-px grid)</h3>
  <div class="row">
    <div class="tok"><div class="bar" style="width:4px"></div><span class="name">1</span><span class="px">4</span></div>
    <div class="tok"><div class="bar" style="width:8px"></div><span class="name">2</span><span class="px">8</span></div>
    <div class="tok"><div class="bar" style="width:12px"></div><span class="name">3</span><span class="px">12</span></div>
    <div class="tok"><div class="bar" style="width:16px"></div><span class="name">4</span><span class="px">16</span></div>
    <div class="tok"><div class="bar" style="width:20px"></div><span class="name">5</span><span class="px">20</span></div>
    <div class="tok"><div class="bar" style="width:24px"></div><span class="name">6</span><span class="px">24</span></div>
    <div class="tok"><div class="bar" style="width:32px"></div><span class="name">8</span><span class="px">32</span></div>
    <div class="tok"><div class="bar" style="width:40px"></div><span class="name">10</span><span class="px">40</span></div>
    <div class="tok"><div class="bar" style="width:48px"></div><span class="name">12</span><span class="px">48</span></div>
    <div class="tok"><div class="bar" style="width:64px"></div><span class="name">16</span><span class="px">64</span></div>
  </div>
  <div class="legend">
    <span><b>page-x · page-y</b> 24px</span>
    <span><b>card padding</b> 20px</span>
    <span><b>sidebar</b> 224px</span>
    <span><b>header</b> 56px</span>
  </div>
</div>
</body></html>
