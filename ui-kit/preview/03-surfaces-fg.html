<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  body { padding: 18px 24px; }
  h3 { margin: 0 0 12px 0; font-weight: 900; font-size: 13px; letter-spacing: -.01em; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 44px; border-radius: 8px; border: 1px solid var(--border); }
  .name { font-size: 11px; color: var(--fg-1); font-weight: 600; }
  .hex { font-size: 10px; color: var(--fg-3); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .text-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-top: 14px; align-items: end; }
  .ts { display: flex; flex-direction: column; gap: 2px; }
  .ts .lbl { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-4); }
  .ts .v { font-size: 14px; font-weight: 600; }
  .ts.fg1 .v { color: var(--fg-1); }
  .ts.fg2 .v { color: var(--fg-2); }
  .ts.fg3 .v { color: var(--fg-3); }
  .ts.fg4 .v { color: var(--fg-4); }
</style></head><body>
<div class="card">
  <h3>Surfaces & Foreground ramp</h3>
  <div class="grid">
    <div class="item"><div class="chip" style="background:#f4f4f5"></div><div class="name">page bg</div><div class="hex">#f4f4f5</div></div>
    <div class="item"><div class="chip" style="background:#ffffff"></div><div class="name">surface</div><div class="hex">#ffffff</div></div>
    <div class="item"><div class="chip" style="background:#f9fafb"></div><div class="name">subtle</div><div class="hex">#f9fafb</div></div>
    <div class="item"><div class="chip" style="background:#f3f4f6"></div><div class="name">muted</div><div class="hex">#f3f4f6</div></div>
  </div>
  <div class="text-row">
    <div class="ts fg1"><span class="lbl">fg-1</span><span class="v">Genel Durum</span><span class="hex">#111827</span></div>
    <div class="ts fg2"><span class="lbl">fg-2</span><span class="v">Genel Durum</span><span class="hex">#374151</span></div>
    <div class="ts fg3"><span class="lbl">fg-3</span><span class="v">Genel Durum</span><span class="hex">#6b7280</span></div>
    <div class="ts fg4"><span class="lbl">fg-4</span><span class="v">Genel Durum</span><span class="hex">#9ca3af</span></div>
  </div>
</div>
</body></html>
